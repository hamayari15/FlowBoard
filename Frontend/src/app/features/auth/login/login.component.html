<div class="container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2 class="form-title">Access Your Account</h2>

    <div class="form-group">
      <label>Email <span class="required">*</span></label>
      <div class="input-icon">
        <i class="fas fa-envelope"></i>
        <input type="email" placeholder="Enter Your Email" formControlName="email" />
      </div>
      <div class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <small *ngIf="loginForm.get('email')?.errors?.['required']">❌ Email is required.</small>
        <small *ngIf="loginForm.get('email')?.errors?.['email']">📧 Invalid email address.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Password <span class="required">*</span></label>
      <div class="input-icon">
        <i class="fas fa-lock"></i>
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Enter Your Password" formControlName="password" />
        <i class="fas toggle-password" (click)="showPassword = !showPassword" 
           [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
      </div>
      <div class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        <small *ngIf="loginForm.get('password')?.errors?.['required']">❌ Password is required.</small>
        <small *ngIf="loginForm.get('password')?.errors?.['minlength']">🔒 Password must contain at least 6 characters.</small>
      </div>
    </div>

    <div *ngIf="serverError" class="alert error-alert">{{ serverError }}</div>
    <button type="submit" [disabled]="loginForm.invalid || isSubmitting" [class.loading]="isSubmitting">
      <span *ngIf="!isSubmitting">Login</span>
      <span *ngIf="isSubmitting" class="loading-content">
        <span class="spinner"></span>
        <span>Logging in...</span>
      </span>
    </button>
    <div class="divider">
      <span>OR</span>
    </div>
    <button class="register" routerLink="/register" [disabled]="isSubmitting">Create an account</button>
  </form>
</div>
