<div class="edit-workspace-container">
  <h3>Edit Workspace</h3>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
    </div>

    <div class="form-group">
      <label for="owner">Owner (ID)</label>
      <input id="owner" type="text" formControlName="owner">
    </div>

    <div class="form-group">
      <label for="members">Members (comma-separated IDs)</label>
      <input id="members" type="text" formControlName="members">
    </div>

    <button type="submit" [disabled]="editForm.invalid">Update Workspace</button>
  </form>
</div>
